<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tumiage（スケジュール管理）</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- 枠(タイトルバー)の色は指定しない＝Macのシステム標準の色になる -->
<style>
  :root{
    --bg:#f7f6fb;
    --card:#ffffff;
    --card-soft:#fbfaff;
    --text:#1a1523;
    --sub:#8b869a;
    --line:#ecebf3;

    --purple:#6d5dfa;
    --blue:#3f86ff;
    --grad:linear-gradient(120deg, var(--blue) 0%, var(--purple) 100%);

    --mid:#4c7cff;
    --mid-bg:#eef2ff;
    --small:#8b5cf6;
    --small-bg:#f2efff;

    --dark-bg:#161022;
    --ring-track:#efeef6;
    --radius:22px;
    --radius-sm:16px;
    --shadow:0 1px 2px rgba(30,20,50,0.05), 0 14px 30px rgba(40,20,70,0.07);
    --shadow-hover:0 2px 4px rgba(30,20,50,0.07), 0 20px 40px rgba(40,20,70,0.11);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background:
      radial-gradient(1100px 420px at 12% -10%, #e6f2ff 0%, rgba(230,242,255,0) 60%),
      radial-gradient(900px 360px at 105% 0%, #e8faf0 0%, rgba(232,250,240,0) 55%),
      #ffffff;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:40px 20px 90px;
    position:relative;
  }

  /* ---------- Header ---------- */
  header.top{
    margin-bottom:16px;
  }
  .year-progress{margin-top:10px; max-width:210px;}
  .year-progress svg{display:block;}
  .yp-text{
    font-size:10.5px; color:var(--sub); font-weight:700;
    margin-top:5px; letter-spacing:.03em;
  }
  .header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  header.top .date-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:700;
    color:#fff;
    background:var(--grad);
    border-radius:999px;
    padding:6px 14px;
    box-shadow:0 8px 18px rgba(109,93,250,0.28);
  }
  h1.title{
    font-size:30px;
    font-weight:800;
    margin:10px 0 0;
    letter-spacing:-0.03em;
    color:var(--text);
  }

  /* ---------- アカウント（ログイン） ---------- */
  .account-box{
    flex:none;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
  }
  .login-btn{
    border:none;
    border-radius:999px;
    padding:7px 14px;
    font-size:12px;
    font-weight:700;
    color:#fff;
    background:var(--grad);
    cursor:pointer;
    box-shadow:0 6px 14px rgba(109,93,250,0.25);
  }
  .login-btn:hover{filter:brightness(1.06);}
  .firebase-off{
    font-size:11px;
    color:var(--sub);
    font-weight:600;
    text-align:right;
    max-width:150px;
    line-height:1.5;
  }
  .user-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 6px 4px 4px;
  }
  .user-chip img{
    width:22px;height:22px;
    border-radius:50%;
    display:block;
  }
  .user-chip span{
    font-size:11.5px;
    font-weight:700;
    color:var(--text);
    max-width:90px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .user-chip button{
    border:none;
    background:none;
    color:var(--sub);
    font-size:13px;
    cursor:pointer;
    padding:0 2px;
    line-height:1;
  }
  .user-chip button:hover{color:#ff3b30;}
  .sync-status{
    font-size:10.5px;
    color:var(--sub);
    font-weight:600;
  }

  /* ---------- Achievement banner (dark hero) ---------- */
  .achieve-banner{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height .45s ease, opacity .35s ease, margin .45s ease;
    margin-bottom:0;
  }
  .achieve-banner.show{
    max-height:200px;
    opacity:1;
    margin-bottom:18px;
  }
  .achieve-banner .inner{
    background:var(--dark-bg);
    border-radius:18px;
    padding:18px 20px;
    position:relative;
    overflow:hidden;
    box-shadow:0 16px 34px rgba(22,16,34,0.35);
  }
  .achieve-banner .inner::before{
    content:'';
    position:absolute;
    inset:-40% -10% auto auto;
    width:220px;height:220px;
    background:var(--grad);
    filter:blur(46px);
    opacity:.55;
  }
  .achieve-banner .headline{
    position:relative;
    font-size:16px;
    font-weight:800;
    background:linear-gradient(120deg, #e4efff 0%, #9db4ff 45%, #d5c9ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .achieve-banner .sub{
    position:relative;
    display:block;
    font-size:12.5px;
    font-weight:500;
    color:#c9c4dd;
    margin-top:4px;
  }


  /* ---------- Rings ---------- */
  .ring{display:block;}
  .ring-fill{
    transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);
  }
  .ring-achieved .ring-fill{
    filter:drop-shadow(0 0 5px rgba(109,93,250,0.5));
  }

  /* ---------- ブロック全体（大きな仕事カード＋メモ、並べ替えできる） ---------- */
  .blocks{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin-top:5px;
  }
  .block-wrap{
    position:relative;
    transition:opacity .15s ease;
  }
  .block-wrap.dragging{
    opacity:.5;
  }

  /* ---------- 大きな仕事カード（複数・開閉できる） ---------- */
  .big-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:0 22px;
    position:relative;
    overflow:hidden;
    transition:box-shadow .25s ease;
  }
  .big-card::before{
    content:'';
    position:absolute;
    left:18px; right:18px; top:0;
    height:5px;
    border-radius:0 0 5px 5px;
    background:var(--grad);
  }
  .big-card:hover{box-shadow:var(--shadow-hover);}
  .big-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:25px 0 16px;
    cursor:pointer;
  }
  .big-head .ring-wrap{flex:none; position:relative;}
  .big-title-wrap{flex:1; min-width:0;}
  .big-title-input{
    width:100%;
    border:none;
    background:transparent;
    font-size:20px;
    font-weight:800;
    color:var(--text);
    padding:2px 0;
    font-family:inherit;
    letter-spacing:-0.01em;
    display:block;
    resize:none;
    overflow:hidden;
    line-height:1.35;
  }
  .big-title-input:focus{outline:none;}
  .big-title-input::placeholder{color:#c9c5d6;font-weight:700;}
  .big-sub{
    font-size:12.5px;
    color:var(--sub);
    font-weight:600;
    margin-top:2px;
  }
  .big-card.open .toggle-arrow{transform:rotate(90deg);}
  .big-body{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height .35s ease, opacity .3s ease, padding-bottom .35s ease;
  }
  .big-card.open .big-body{
    max-height:3000px;
    opacity:1;
    padding-bottom:16px;
  }

  .mediums{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .add-big-row{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:18px;
    margin-bottom:14px;
  }
  .add-big-row input{
    flex:1;
    border:1.5px dashed #d9b8ff;
    border-radius:13px;
    padding:11px 14px;
    font-size:14px;
    font-family:inherit;
    background:#fbfaff;
    transition:border-color .15s ease;
  }
  .add-big-row input:focus{outline:none;border-color:var(--purple);}
  .plus-btn.big-accent{background:var(--grad);}
  .big-full-msg{
    font-size:12px;
    color:var(--sub);
    margin-bottom:14px;
  }

  /* ---------- 中カテゴリー ---------- */
  .mid-card{
    background:var(--card-soft);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:14px 16px 12px;
    transition:background .3s ease, border-color .3s ease, transform .15s ease;
  }
  .mid-card:hover{transform:translateY(-1px);}
  .mid-card.achieved{
    background:linear-gradient(120deg, #eef2ff 0%, #f2efff 100%);
    border-color:#e0d9ff;
  }
  .mid-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .mid-head .ring-wrap{flex:none;}
  .mid-title-wrap{flex:1; min-width:0;}
  .mid-title-input{
    width:100%;
    border:none;
    background:transparent;
    font-size:14.5px;
    font-weight:700;
    color:var(--text);
    font-family:inherit;
  }
  .mid-title-input:focus{outline:none;}
  .mid-title-input::placeholder{color:#bcb8c9;font-weight:700;}
  .mid-count{
    font-size:11.5px;
    color:var(--mid);
    font-weight:700;
  }

  .trash-btn, .mid-trash{
    flex:none; border:none; background:transparent;
    color:#cbc7d8; cursor:pointer; padding:5px;
    border-radius:8px; line-height:0;
    transition:color .15s ease, background .15s ease, transform .15s ease;
  }
  .trash-btn:hover, .mid-trash:hover{ color:#e0566b; background:#fdeff1; }
  .trash-btn:active, .mid-trash:active{ transform:scale(.88); }

  .move-btns{
    flex:none; display:flex; flex-direction:column; gap:2px;
  }
  .move-btn{
    width:26px; height:19px; padding:0;
    border:1px solid var(--line); background:#fff;
    color:var(--sub); font-size:9px; line-height:1;
    border-radius:6px; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .move-btn:active{background:var(--mid-bg); color:var(--mid);}

  .repeat-btn{
    flex:none;
    border:none;
    background:transparent;
    font-size:16px;
    line-height:1;
    padding:5px;
    border-radius:9px;
    cursor:pointer;
    opacity:.25;
    filter:grayscale(1);
    transition:opacity .2s ease, filter .2s ease, background .2s ease;
  }
  .repeat-btn.on{opacity:1; filter:none; background:var(--mid-bg);}
  .repeat-btn:active{transform:scale(.92);}

  .big-check{
    width:24px;height:24px;
    border-radius:8px;
    border:2px solid var(--purple);
    flex:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    transition:background .2s ease, transform .18s cubic-bezier(.4,0,.2,1);
  }
  .big-check svg{width:15px;height:15px;opacity:0;transition:opacity .15s ease;}
  .big-check.on{background:var(--purple);}
  .big-check.on svg{opacity:1;}
  .big-check:active{transform:scale(.9);}

  .mid-check{
    width:22px;height:22px;
    border-radius:7px;
    border:2px solid var(--mid);
    flex:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    transition:background .2s ease, transform .18s cubic-bezier(.4,0,.2,1);
  }
  .mid-check svg{width:14px;height:14px;opacity:0;transition:opacity .15s ease;}
  .mid-check.on{background:var(--mid);}
  .mid-check.on svg{opacity:1;}
  .mid-check:active{transform:scale(.9);}

  ul.small-tasks{
    list-style:none;
    margin:0;
    padding:0;
  }
  ul.small-tasks li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 2px;
    border-top:1px solid var(--line);
  }
  ul.small-tasks li:first-child{border-top:none;}
  li.done-bar{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:9px 2px; cursor:pointer;
    border-top:1px solid var(--line);
  }
  .done-bar-txt{font-size:12px; color:var(--sub); font-weight:700;}
  .done-bar-act{
    font-size:11px; font-weight:800; color:var(--mid);
    background:var(--mid-bg); border-radius:99px; padding:3px 10px;
  }
  .check{
    width:20px;height:20px;
    border-radius:6px;
    border:2px solid var(--small);
    flex:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    transition:transform .18s cubic-bezier(.4,0,.2,1), background .2s ease;
  }
  .check.pop{transform:scale(1.28);}
  li.done .check{background:var(--small);}
  .check svg{width:11px;height:11px;display:none;}
  li.done .check svg{display:block;}
  .task-text{
    flex:1;
    font-size:14.5px;
  }
  li.done .task-text{
    color:var(--sub);
    text-decoration:line-through;
  }
  .del{
    border:none;
    background:none;
    color:#d2cfdc;
    font-size:17px;
    cursor:pointer;
    padding:2px 6px;
    line-height:1;
    transition:color .15s ease;
  }
  .del:hover{color:#ff3b30;}

  .add-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px;
  }
  .add-row input{
    flex:1;
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 11px;
    font-size:13.5px;
    font-family:inherit;
    background:#fff;
    transition:border-color .15s ease;
  }
  .add-row input:focus{outline:none;border-color:var(--small);}
  .plus-btn{
    flex:none;
    width:30px;height:30px;
    border-radius:50%;
    border:none;
    color:#fff;
    cursor:pointer;
    font-size:17px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    transition:transform .15s ease, filter .15s ease;
  }
  .plus-btn:hover{filter:brightness(1.08);}
  .plus-btn:active{transform:scale(.9);}
  .plus-btn.small-accent{background:var(--small);}
  .plus-btn.mid-accent{background:var(--mid);}

  .full-msg{
    font-size:12px;
    color:var(--sub);
    margin-top:8px;
  }

  .add-medium-row{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:14px;
  }
  .add-medium-row input{
    flex:1;
    border:1.5px dashed #cfd6ff;
    border-radius:13px;
    padding:10px 13px;
    font-size:13.5px;
    font-family:inherit;
    background:#fbfbff;
    transition:border-color .15s ease;
  }
  .add-medium-row input:focus{outline:none;border-color:var(--mid);}
  .medium-full-msg{
    font-size:12px;
    color:var(--sub);
    margin-top:12px;
  }

  /* ---------- confetti ---------- */
  .confetti-piece{
    position:absolute;
    top:0;
    width:7px;height:11px;
    border-radius:2px;
    pointer-events:none;
    animation:confetti-fall 900ms ease-out forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(70px) rotate(340deg); opacity:0; }
  }

  /* ---------- ドラッグの持ち手・開閉の矢印（共通パーツ） ---------- */
  .drag-handle{
    flex:none;
    cursor:grab;
    touch-action:none;
    color:#d3cfe0;
    padding:6px 2px;
    display:flex;
    align-items:center;
  }
  .drag-handle:active{cursor:grabbing;}
  .toggle-arrow{
    flex:none;
    color:var(--sub);
    transition:transform .25s ease;
    padding:6px;
    display:flex;
    align-items:center;
  }
  .memo-card.open .toggle-arrow{transform:rotate(90deg);}

  /* ---------- メモ欄（アコーディオン） ---------- */
  .memo-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:0 22px;
    position:relative;
    overflow:hidden;
    transition:box-shadow .25s ease;
  }
  .memo-card::before{
    content:'';
    position:absolute;
    left:18px; right:18px; top:0;
    height:5px;
    border-radius:0 0 5px 5px;
    background:linear-gradient(120deg, #4c7cff 0%, #6d5dfa 100%);
  }
  .memo-card:hover{box-shadow:var(--shadow-hover);}
  .memo-toggle{
    width:100%;
    border:none;
    background:none;
    padding:19px 0 17px;
    display:flex;
    align-items:center;
    gap:13px;
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
  }
  .memo-icon{
    flex:none;
    width:36px;height:36px;
    border-radius:50%;
    background:var(--mid-bg);
    color:var(--mid);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .memo-title-wrap{flex:1; min-width:0; text-align:left;}
  .memo-title{
    display:block;
    font-size:15px;
    font-weight:800;
    color:var(--text);
  }
  .memo-sub{
    display:block;
    font-size:11.5px;
    font-weight:600;
    color:var(--sub);
    margin-top:1px;
  }
  .memo-body{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height .3s ease, opacity .25s ease, padding-bottom .3s ease;
  }
  .memo-card.open .memo-body{
    max-height:600px;
    opacity:1;
    padding-bottom:18px;
  }
  .memo-body textarea{
    width:100%;
    min-height:180px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px 14px;
    font-size:14px;
    line-height:1.7;
    font-family:inherit;
    color:var(--text);
    background:#fbfbfd;
  }
  .memo-body textarea:focus{outline:none; border-color:var(--purple);}

  /* ---------- 夜のふりかえり（残りをどうするか） ---------- */

  /* ---------- 週次ふりかえりモーダル ---------- */
  .review-btn{
    width:100%;
    padding:13px;
    border-radius:15px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--text);
    font-size:13.5px;
    font-weight:800;
    cursor:pointer;
    margin-bottom:10px;
    font-family:inherit;
  }
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,14,30,0.45);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:30;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:20px;
    max-width:560px;
    width:100%;
    padding:24px 22px;
    box-shadow:0 24px 60px rgba(20,14,30,0.35);
    /* 中身が多くても途中で切れないよう、枠の中でスクロールさせる */
    max-height:86vh;
    overflow-y:auto;
  }
  .heat-scroll{overflow-x:auto; padding:4px 0 2px; margin:14px 0 6px;}
  .heat-scroll svg{display:block;}
  .heat-legend{
    display:flex; align-items:center; gap:6px;
    font-size:10.5px; color:var(--sub); font-weight:700; margin-bottom:14px;
  }
  .heat-legend i{width:9px; height:9px; border-radius:2px; display:inline-block;}
  .yr-stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr));
    gap:8px; margin-bottom:16px;
  }
  .yr-stat{
    background:var(--bg); border-radius:12px; padding:10px 12px;
  }
  .yr-stat span{display:block; font-size:10.5px; color:var(--sub); font-weight:700;}
  .yr-stat b{font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;}
  .task-text[contenteditable]{
    outline:none;
    border-radius:6px;
    padding:2px 4px;
    margin:-2px -4px;
    transition:background .15s ease;
  }
  .task-text[contenteditable]:focus{
    background:var(--mid-bg);
  }

  .mid-done-bar, .big-done-bar{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; cursor:pointer; user-select:none;
  }
  .mid-done-bar{
    padding:10px 12px; margin-top:2px;
    border:1px dashed var(--line); border-radius:12px;
    background:var(--card-soft);
  }
  .big-done-bar{
    padding:14px 18px; margin-bottom:18px;
    background:var(--card); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .wr-box{border-bottom:1px solid var(--line);}
  .wr-box:last-child{border-bottom:none;}
  .week-row.clickable{cursor:pointer;}
  .wr-arrow{flex:none; color:var(--sub); transition:transform .22s ease;}

  // 1年のうちどこまで来たかを、12個の月で表す（過ぎた月は満ちる）
  function renderYearProgress(){
    const el = document.getElementById('year-progress');
    if(!el) return;
    const now = new Date(), y = now.getFullYear();
    const start = new Date(y,0,1), end = new Date(y+1,0,1);
    const total = Math.round((end - start) / 86400000);
    const passed = Math.floor((now - start) / 86400000);
    const pct = Math.round(passed / total * 100);
    const m = now.getMonth();
    const dim = new Date(y, m+1, 0).getDate();
    const mFrac = now.getDate() / dim;
    const R = 5.2, GAP = 14.6, PAD = 1, CY = R + 1;
    const W = PAD*2 + R*2 + 11*GAP;
    const clipY = CY + R - (2*R*mFrac);
    let s = '';
    for(let i=0;i<12;i++){
      const cx = PAD + R + i*GAP;
      if(i < m){
        s += '<circle cx="'+cx+'" cy="'+CY+'" r="'+R+'" fill="url(#ypG)"/>';
      } else if(i === m){
        s += '<circle cx="'+cx+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="#d5cfe8" stroke-width="1.3"/>'
           + '<circle cx="'+cx+'" cy="'+CY+'" r="'+R+'" fill="url(#ypG)" clip-path="url(#ypClip)"/>';
      } else {
        s += '<circle cx="'+cx+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="#e5e1f1" stroke-width="1.3"/>';
      }
    }
    el.innerHTML = '<svg viewBox="0 0 '+W+' '+(R*2+2)+'" width="100%" height="13" preserveAspectRatio="xMinYMid meet">'
      + '<defs><linearGradient id="ypG" x1="0" y1="0" x2="1" y2="0">'
      + '<stop offset="0%" stop-color="#3f86ff"/><stop offset="100%" stop-color="#7c5cfc"/></linearGradient>'
      + '<clipPath id="ypClip"><rect x="0" y="'+clipY+'" width="'+W+'" height="'+(2*R)+'"/></clipPath></defs>'
      + s + '</svg>'
      + '<div class="yp-text">' + y + '年を ' + pct + '% ・ 残り ' + (total - passed) + '日</div>';
  }

  function ringSVG(percent, size, stroke, color, achieved){
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const offset = c * (1 - Math.min(percent,100) / 100);
    const centerText = achieved
      ? `<text x="50%" y="55%" text-anchor="middle" font-size="${size*0.34}" font-weight="800" fill="${color}">✓</text>`
      : `<text x="50%" y="55%" text-anchor="middle" font-size="${size*0.22}" font-weight="800" fill="${color}">${Math.round(percent)}%</text>`;
    return `<svg class="ring ${achieved?'ring-achieved':''}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="${stroke}"/>
      <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${size/2} ${size/2})"/>
      ${centerText}
    </svg>`;
  }

  // ---- ブロックの並び順（大きな仕事＋メモ）を管理 ----
  function syncBlockOrder(){

    const validKeys = new Set(state.bigs.map(b=>'big:'+b.id));
    validKeys.add('memo');
    state.blockOrder = state.blockOrder.filter(k=> validKeys.has(k));
    state.bigs.forEach(b=>{
      const key = 'big:'+b.id;
      if(!state.blockOrder.includes(key)) state.blockOrder.push(key);
    });
    if(!state.blockOrder.includes('memo')) state.blockOrder.push('memo');
  }

  // ---- ドラッグ＆ドロップで並べ替え（マウスもスマホのタッチも対応） ----
  function enableDragReorder(container, onReorder){
    const children = Array.from(container.querySelectorAll(':scope > .block-wrap'));
    children.forEach(child=>{
      const handle = child.querySelector('.drag-handle');
      if(!handle) return;
      handle.addEventListener('click', e=> e.stopPropagation());
      handle.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const dragEl = child;
        dragEl.classList.add('dragging');
        const pointerId = e.pointerId;
        try{ handle.setPointerCapture(pointerId); }catch(err){}

        function onMove(ev){
          const y = ev.clientY;
          const siblings = Array.from(container.querySelectorAll(':scope > .block-wrap')).filter(el=>el!==dragEl);
          for(const sib of siblings){
            const rect = sib.getBoundingClientRect();
            const mid = rect.top + rect.height/2;
            const dragIsAfter = !!(sib.compareDocumentPosition(dragEl) & Node.DOCUMENT_POSITION_FOLLOWING);
            if(y < mid && dragIsAfter){
              container.insertBefore(dragEl, sib);
              break;
            } else if(y >= mid && !dragIsAfter){
              container.insertBefore(dragEl, sib.nextSibling);
              break;
            }
          }
        }
        function onUp(){
          dragEl.classList.remove('dragging');
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          try{ handle.releasePointerCapture(pointerId); }catch(err){}
          const newOrder = Array.from(container.querySelectorAll(':scope > .block-wrap')).map(el=>el.dataset.blockKey);
          onReorder(newOrder);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  }

  function onBlocksReordered(newOrder){
    state.blockOrder = newOrder;

    requestAnimationFrame(growTitle);
    titleInput.addEventListener('click', e=> e.stopPropagation());

    titleInput.addEventListener('input', (e)=>{

    // ▲▼で並べ替え。ドラッグが分かりにくい端末でも確実に動かせる。
    function moveBig(dir){
      const keys = state.blockOrder;
      const me = 'big:' + big.id;
      const idx = keys.indexOf(me);
      if(idx === -1) return;
      let target = -1;
      if(dir < 0){
        for(let i=idx-1;i>=0;i--){ if(String(keys[i]).indexOf('big:') === 0){ target = i; break; } }
      } else {
        for(let i=idx+1;i<keys.length;i++){ if(String(keys[i]).indexOf('big:') === 0){ target = i; break; } }
      }
      if(target === -1){ showToast(dir < 0 ? 'いちばん上です。' : 'いちばん下です。'); return; }
      keys[idx] = keys[target];
      keys[target] = me;
      render();
    }
    head.querySelectorAll('.move-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        moveBig(Number(btn.dataset.dir));

    const openMids = [], finishedMids = [];
    big.mediums.forEach((medium, mIdx)=>{

      const manualDone = medium.done === true;
      const achieved = manualDone || (total > 0 && doneItems === total);

    // 数え方は bigProgress に1本化してある（帯の「進んでいません」と食い違わせない）
    const prog = bigProgress(big);
    const totalDone = prog.done, totalPlanned = prog.planned;
    const manualBigDone = big.done === true;
    const percent = manualBigDone ? 100 : (totalPlanned > 0 ? (totalDone/totalPlanned*100) : 0);
    const achieved = manualBigDone || (totalPlanned > 0 && totalDone === totalPlanned);

    head.querySelector('.ring-wrap').innerHTML = ringSVG(percent, 52, 6, 'url(#bigGrad)', achieved);

      if(!applyingRemote){ markBigMoved(big); addBlocks(1); }
    }
    big.wasAchieved = achieved;

    return { el: wrap, achieved, hasItems: totalPlanned > 0, manualDone: manualBigDone };
  }

  // ---- まとめて追加：字下げテキストを 大／中／小 にまとめて取りこむ ----
  function parseBulkText(raw){
    const lines = String(raw||'').replace(/\r/g,'').split('\n');
    const entries = [];
    lines.forEach(line=>{
      if(!line.trim()) return;
      // 「# 見出し」「## 〜」「### 〜」形式にも対応する
      const head = line.match(/^[\s　]*(#{1,3})[\s　]+(.*)$/);
      if(head){
        const t = head[2].trim();
        if(t) entries.push({level: head[1].length - 1, text: t});
        return;
      }
      const m = line.match(/^([\s　]*)([\s\S]*)$/);
      let width = 0;
      for(const ch of (m[1]||'')){
        if(ch === '\t') width += 4;
        else if(ch === '　') width += 2;
        else width += 1;
      }
      // 行頭の「-」「・」などの記号は目印なので外す
      const text = (m[2]||'').replace(/^[-*+＊・●○◯•▪]+[\s　]*/,'').trim();
      if(!text) return;
      entries.push({indent: width, text});
    });

    // 字下げの深さから段を決める。
    // 「全体で何種類あるか」ではなく「直前の行と比べて深いか浅いか」で判定するので、
    // スペース字下げとタブ字下げが混ざっていても正しく段が決まる。
    const stack = [];
    entries.forEach(e=>{
      if(typeof e.level === 'number') return;
      const w = e.indent;
      while(stack.length && w < stack[stack.length - 1]) stack.pop();
      if(!stack.length || w > stack[stack.length - 1]) stack.push(w);
      let lv = stack.length - 1;
      if(lv > 2) lv = 2;
      e.level = lv;
    });

    const bigs = [];
    const warnings = [];
    let curBig = null, curMed = null, dropped = 0;
    entries.forEach(e=>{
      if(e.level === 0){
        curBig = {title:e.text, mediums:[]};
        bigs.push(curBig);
        curMed = null;
        return;
      }
      if(!curBig){
        curBig = {title:'その他', mediums:[]};
        bigs.push(curBig);
        curMed = null;
      }
      if(e.level === 1){
        if(curBig.mediums.length >= MAX_MEDIUM){ dropped++; curMed = null; return; }
        curMed = {name:e.text, items:[]};
        curBig.mediums.push(curMed);
        return;
      }
      if(!curMed){
        if(curBig.mediums.length >= MAX_MEDIUM){ dropped++; return; }
        curMed = {name:'やること', items:[]};
        curBig.mediums.push(curMed);
      }
      if(curMed.items.length >= MAX_SMALL_PER_MEDIUM){ dropped++; return; }
      curMed.items.push(e.text);
    });
    if(dropped > 0){
      warnings.push('上限を超えた ' + dropped + ' 件は取りこまれません（中くらいは' + MAX_MEDIUM + 'つ、小さいは' + MAX_SMALL_PER_MEDIUM + 'つまで）。');
    }
    return {bigs:bigs, warnings:warnings};
  }

  function renderBulkPreview(){
    const box = document.getElementById('bulk-preview');

    if(!parsed.bigs.length){ box.style.display='none'; box.textContent=''; return; }

    let meds = 0, smalls = 0;
    const lines = [];
    parsed.bigs.forEach(b=>{
      lines.push('■ ' + b.title);
      b.mediums.forEach(m=>{
        meds++;
        lines.push('　└ ' + m.name);
        m.items.forEach(it=>{ smalls++; lines.push('　　・' + it); });
      });
    });

    const warns = parsed.warnings.slice();
    const willBe = state.bigs.length + parsed.bigs.length;
    if(willBe > MAX_BIG){
      warns.push('「追加」だと大きな仕事が ' + willBe + ' 個になり、上限の ' + MAX_BIG + ' を超えます。超えた分は入りません（「ぜんぶ置きかえる」なら収まります）。');
    }

    box.innerHTML = '';
    const head = document.createElement('span');
    head.className = 'bulk-head';
    head.textContent = 'この形で取りこみます（大 ' + parsed.bigs.length + ' ／中 ' + meds + ' ／小 ' + smalls + '）';
    box.appendChild(head);
    box.appendChild(document.createTextNode(lines.join('\n')));
    warns.forEach(w=>{
      const el = document.createElement('div');
      el.className = 'bulk-warn';
      el.textContent = '⚠ ' + w;

    });

  }

  function dateKeyOffset(offsetDays){
    const d = new Date();
    d.setDate(d.getDate() - offsetDays);
    return {
      key: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
      label: (d.getMonth()+1)+'/'+d.getDate()
    };
  }
  // ボードが日付ごとに分かれていた頃（2026-08-21より前）の記録から、その日の数を出す
  const BOARD_BECAME_PERMANENT = '2026-08-21';
  function countOfDay(key, data){
    if(dayLog[key] !== undefined) return dayLog[key];      // 押した瞬間に数えた本物
    if(key >= BOARD_BECAME_PERMANENT) return 0;            // 記録が無い日は数えられない
    return pointsOfDay(data);                              // 昔の、日ごとに分かれていた記録
  }
  function pointsOfDay(data){
    let pts = 0;
    (data && data.bigs ? data.bigs : []).forEach(b=>{
      if(b.done) pts += 1;
      (b.mediums||[]).forEach(m=>{
        if(m.done) pts += 1;
        (m.items||[]).forEach(it=>{ if(it.done) pts += 1; });
      });
    });
    return pts;
  }

  // 1年ぶんの積み上げを、日ごとのマスで見せる
  function renderYearHeat(log){
    const el = document.getElementById('year-heat');
    const now = new Date(), y = now.getFullYear();
    const jan1 = new Date(y,0,1);
    const startOffset = jan1.getDay();
    const days = Math.round((new Date(y+1,0,1) - jan1) / 86400000);
    const cell = 9, gap = 2.4;
    const cols = Math.ceil((startOffset + days) / 7);
    const W = Math.round(cols * (cell + gap)), H = Math.round(7 * (cell + gap));
    let s = '', total = 0, active = 0, best = 0, run = 0;
    for(let d = 0; d < days; d++){
      const date = new Date(y, 0, 1 + d);
      const key = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
      const v = log[key] !== undefined ? log[key] : (dayLog[key] || 0);
      total += v;
      if(v > 0){ active++; run++; if(run > best) best = run; }
      else if(date <= now){ run = 0; }
      const gi = startOffset + d, col = Math.floor(gi/7), row = gi % 7;
      const future = date > now;
      const fill = future ? '#f7f6fa'
        : (v >= 15 ? '#6d5dfa' : v >= 8 ? '#8f83fb' : v >= 4 ? '#bab2fd' : v > 0 ? '#ded9ff' : '#ebe8f3');
      s += '<rect x="' + (col*(cell+gap)).toFixed(1) + '" y="' + (row*(cell+gap)).toFixed(1)
        + '" width="' + cell + '" height="' + cell + '" rx="2" fill="' + fill + '"><title>'
        + key + '　' + v + '個</title></rect>';
    }
    el.innerHTML = '<div class="heat-scroll"><svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' + s + '</svg></div>'
      + '<div class="heat-legend"><span>少ない</span>'
      + '<i style="background:#ebe8f3"></i><i style="background:#ded9ff"></i><i style="background:#bab2fd"></i>'
      + '<i style="background:#8f83fb"></i><i style="background:#6d5dfa"></i>'
      + '<span>多い</span></div>';
    return { total: total, active: active, best: best, year: y };
  }

  // その日「終わったもの」だけを、大→中→小で見せる。
  // 未完了まで入れると量が膨大になって読めなくなるため、完了分だけを残す。
  function buildDayDetail(data){
    const wrap = document.createElement('div');
    wrap.className = 'wr-detail';
    const bigs = Array.isArray(data.bigs) ? data.bigs : [];
    let any = false;

    bigs.forEach(b=>{
      const mids = [];
      (b.mediums||[]).forEach(m=>{
        const doneItems = (m.items||[]).filter(it=> it.done);
        if(m.done || doneItems.length) mids.push({ m: m, items: doneItems });
      });
      if(!b.done && !mids.length) return;   // この大きな仕事は、この日なにも終わっていない
      any = true;

      let cnt = 0;
      mids.forEach(x=> cnt += x.items.length);

      const bg = document.createElement('div');
      bg.className = 'wd-big';
      bg.innerHTML = '<div class="wd-big-t"><b></b><span></span></div>';
      bg.querySelector('b').textContent = (b.done ? '✓ ' : '') + (b.title || '（無題）');
      bg.querySelector('span').textContent = cnt ? (cnt + '件') : '';

      mids.forEach(x=>{
        const md = document.createElement('div');
        md.className = 'wd-mid';
        const mt = document.createElement('div');
        mt.className = 'wd-mid-t';
        mt.textContent = (x.m.done ? '✓ ' : '') + (x.m.name || '（無題）');
        md.appendChild(mt);
        x.items.forEach(it=>{
          const li = document.createElement('div');
          li.className = 'wd-item';
          li.textContent = '✓ ' + (it.text || '');
          md.appendChild(li);
        });
        bg.appendChild(md);
      });
      wrap.appendChild(bg);
    });

    if(!any) wrap.innerHTML = '<div class="wd-empty">この日は終わったものがありません。</div>';
    return wrap;
  }

    // 保存されている日をまとめて1回で読む
    fbDb.collection('users').doc(currentUser.uid).collection('days').get().then(snap=>{

      listEl.innerHTML = '';

          box.appendChild(row);
          listEl.appendChild(box);
          continue;
        }

        recordedCount++;
        const bigs = Array.isArray(data.bigs) ? data.bigs : [];
        let done = 0, planned = 0;
        bigs.forEach(b=> (b.mediums||[]).forEach(m=> (m.items||[]).forEach(it=>{
          planned++; if(it.done) done++;
        })));
        const achieved = planned > 0 && done === planned;
        if(achieved) achievedCount++;
        const titles = bigs.map(b=>b.title).filter(Boolean).join('・') || '（未入力）';

        row.className = 'week-row clickable' + (achieved ? ' achieved' : '');
        row.innerHTML = '<div class="wr-date"></div><div class="wr-title"></div><div class="wr-stat"></div>'
          + '<svg class="wr-arrow" viewBox="0 0 24 24" width="11" height="11" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        row.querySelector('.wr-date').textContent = d.label;
        row.querySelector('.wr-title').textContent = titles;
        row.querySelector('.wr-stat').textContent = (log[d.key] || 0) + '個';
        box.appendChild(row);

        const det = buildDayDetail(data);
        det.style.display = 'none';
        row.addEventListener('click', ()=>{
          const willOpen = det.style.display === 'none';
          det.style.display = willOpen ? 'block' : 'none';
          row.classList.toggle('open', willOpen);
        });
        box.appendChild(det);
        listEl.appendChild(box);
      }

      summaryEl.innerHTML = '<div class="week-summary">' + (recordedCount === 0
        ? '記録はまだありません。今日から積み上げていこう。'
        : '直近14日のうち、記録がある日は' + recordedCount + '日。日付を押すと、その日の中身が開きます。') + '</div>';
    }).catch(()=>{
      renderYearHeat({});

      summaryEl.innerHTML = '<div class="week-summary">読み込みに失敗しました。もう一度お試しください。</div>';
    });

  let calTokenClient = null;

  // 一度もらった鍵(アクセストークン)は、有効期限まで端末に覚えておく。
  // こうすると画面を更新しても、期限内は許可画面が出ない。
  const CAL_TOKEN_KEY = 'tsumiage_cal_token';
  function saveCalToken(token, expiresInSec){
    try{
      localStorage.setItem(CAL_TOKEN_KEY, JSON.stringify({
        token: token,
        expiresAt: Date.now() + (Number(expiresInSec || 3600) * 1000) - 60000
      }));
    }catch(e){}
  }
  function loadCalToken(){
    try{
      const raw = localStorage.getItem(CAL_TOKEN_KEY);
      if(!raw) return null;
      const o = JSON.parse(raw);
      if(!o || !o.token || !o.expiresAt) return null;
      if(Date.now() >= o.expiresAt){ localStorage.removeItem(CAL_TOKEN_KEY); return null; }
      return o.token;
    }catch(e){ return null; }
  }
  function clearCalToken(){
    try{ localStorage.removeItem(CAL_TOKEN_KEY); }catch(e){}
    calendarAccessToken = null;
  }

  function ensureCalTokenClient(){
    if(calTokenClient) return calTokenClient;
    if(!(window.google && window.google.accounts && window.google.accounts.oauth2)) return null;
    calTokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_OAUTH_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar.readonly',
      // 空にしておくと、一度許可したあとは確認画面を出さずに鍵を出し直してくれる
      prompt: '',
      callback: (resp)=>{
        if(resp && resp.access_token){
          calendarAccessToken = resp.access_token;
          saveCalToken(resp.access_token, resp.expires_in);
          fetchTodayCalendarEvents(calendarAccessToken);
        } else {
          console.error('[calendar] no access_token in response', resp);
          showToast('カレンダーへのアクセスが許可されませんでした。');
        }
      },
      error_callback: (err)=>{
        const type = err && err.type;
        console.error('[calendar] GIS error', type, err);
        if(type === 'popup_closed'){
          showToast('カレンダーの許可が途中で閉じられました。');
        } else if(type === 'popup_failed_to_open'){
          showToast('ポップアップがブロックされました。ブラウザの設定で許可してください。');
        } else {
          showToast('カレンダーへのアクセスが許可されませんでした。');
        }
      }
    });
    return calTokenClient;
  }

  const CAL_DAYS = ['日','月','火','水','木','金','土'];

  function formatEventDate(ev){
    const raw = (ev.start && (ev.start.dateTime || ev.start.date));
    if(!raw) return '';
    const d = new Date(raw);
    return (d.getMonth()+1) + '/' + d.getDate() + '（' + CAL_DAYS[d.getDay()] + '）';
  }

  function formatEventTime(ev){
    if(ev.start && ev.start.dateTime){
      const d = new Date(ev.start.dateTime);
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    return '終日';
  }

  function renderCalendarEvents(events){
    const box = document.getElementById('cal-events');
    box.style.display = 'block';
    if(!events || events.length === 0){
      box.innerHTML = '<div class="cal-empty">これから3日間の予定は見つかりませんでした。</div>';
      return;
    }
    box.innerHTML = '';
    events.forEach(ev=>{
      const row = document.createElement('div');
      row.className = 'cal-event-row';
      row.innerHTML = `<span class="cal-event-date"></span><span class="cal-event-time"></span><span class="cal-event-title"></span>`;
      row.querySelector('.cal-event-date').textContent = formatEventDate(ev);
      row.querySelector('.cal-event-time').textContent = formatEventTime(ev);
      row.querySelector('.cal-event-title').textContent = ev.summary || '（タイトルなし）';
      box.appendChild(row);
    });
  }

  function fetchTodayCalendarEvents(token){
    setCalStatus('読み込み中…');
    const d = new Date();
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0,0,0).toISOString();
    const dayEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate()+2, 23,59,59).toISOString();
    const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
      + '?timeMin=' + encodeURIComponent(dayStart)
      + '&timeMax=' + encodeURIComponent(dayEnd)
      + '&singleEvents=true&orderBy=startTime';

    fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
      .then(res=>{
        if(!res.ok){
          if(res.status === 401 || res.status === 403){
            clearCalToken();
            setCalStatus('もう一度タップしてください');
          } else {
            setCalStatus('読み込めませんでした');
          }
          return null;
        }
        return res.json();
      })
      .then(data=>{
        if(!data) return;
        renderCalendarEvents(data.items || []);
        calLoadedDateKey = todayKey();
        setCalStatus('');
      })
      .catch(()=>{
        setCalStatus('通信エラー');
      });
  }

  function setCalStatus(t){
    const el = document.getElementById('cal-status');
    if(el) el.textContent = t || '';
  }

  // interactive = 自分でタップしたときだけ true。
  // 開いた直後の自動読み込みでは、勝手にポップアップを出さない。
  function loadCalendarNow(interactive){
    if(!FIREBASE_READY || !currentUser){
      setCalStatus('ログインが必要です');
      return;
    }
    if(!calendarAccessToken) calendarAccessToken = loadCalToken();
    if(calendarAccessToken){
      fetchTodayCalendarEvents(calendarAccessToken);
      return;
    }
    if(!interactive){
      setCalStatus('タップして読み込み');
      return;
    }
    const client = ensureCalTokenClient();
    if(!client){
      showToast('カレンダーの準備中です。少し待ってから、もう一度押してください。');
      return;
    }
    // タップ直後に間を空けずそのまま呼ぶこと（待つとポップアップが止められる）
    client.requestAccessToken();
  }


  // これまでに終わった数の合計（ふりかえり画面の「通算」だけに使う）
  let totalBlocks = 0;

  // 日ごとに終わった数。1年ぶんのふりかえりと、連続日数に使う
  let dayLog = {};
  function recordDayPoints(n){
    const k = todayKey();
    dayLog[k] = (dayLog[k] || 0) + n;
    if(!FIREBASE_READY || !currentUser) return;
    const upd = {}; upd['dayLog.' + k] = dayLog[k];
    profileRefForUser(currentUser.uid).update(upd).catch(()=>{
      profileRefForUser(currentUser.uid).set({ dayLog: dayLog }, {merge:true}).catch(()=>{});
    });
  }

  // 何かが1つ終わったときに呼ばれる
  function addBlocks(n){
    if(!n || n < 0) return;
    totalBlocks += n;
    recordDayPoints(n);
    updateFactsCard();
    if(FIREBASE_READY && currentUser){
      profileRefForUser(currentUser.uid)
        .set({ totalBlocks: totalBlocks }, {merge:true})
        .catch(()=>{});
    }
  }

  // 何日つづけて積み上げているか。
  // 今日がまだ0点でも、昨日まで続いていれば途切れた扱いにしない（1日の途中だから）。
  function currentStreak(){
    const keyOf = (d)=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const d = new Date();
    if(!(dayLog[keyOf(d)] > 0)) d.setDate(d.getDate() - 1);
    let n = 0;
    while(dayLog[keyOf(d)] > 0 && n < 4000){ n++; d.setDate(d.getDate() - 1); }
    return n;
  }


  // ---- いまの状態を映す帯 ----
  // 出すのは、記録から出てくるものだけ。
  //  ・どの大きな仕事が、何日 進んでいないか
  //  ・今週と先週で、終わった数がどう違うか
  //  ・何日つづけて積み上げているか
  // レベル・位・城はやめた。自分でチェックを押して増やした数字は、
  // 見ても新しいことが何も分からないので、見なくなる。

  const STALL_DAYS = 2;   // これ以上なにも終わっていない大きな仕事を「進んでいない」とみなす

  function dateKeyOf(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  // 大きな仕事の進み具合。数え方はここ1本に寄せる（renderBigBlock もこれを使う）。
  function bigProgress(big){
    let done = 0, planned = 0;
    (big.mediums||[]).forEach(m=>{
      const items = m.items || [];
      const doneItems = items.filter(i=>i.done).length;
      const total = items.length;
      // 中くらいの仕事は、小さい仕事が無くてもチェックだけで完了にできる
      const achieved = m.done === true || (total > 0 && doneItems === total);
      done    += achieved ? (total > 0 ? total : 1) : doneItems;
      planned += total > 0 ? total : 1;
    });
    return { done, planned, achieved: big.done === true || (planned > 0 && done === planned) };
  }

  // 最後に何かが終わった日から、何日たったか
  function daysSinceMs(ms){
    const a = new Date(ms); a.setHours(0,0,0,0);
    const b = new Date();   b.setHours(0,0,0,0);
    return Math.round((b - a) / 86400000);
  }

  // 何かが終わったら、その大きな仕事に「動いた」と記録しておく
  function markBigMoved(big){
    if(big) big.lastActiveAt = Date.now();
  }

  function stalledBigs(){
    return state.bigs
      .filter(b=> b.title && b.title.trim())
      .filter(b=> typeof b.lastActiveAt === 'number')
      .filter(b=> !bigProgress(b).achieved)
      .map(b=> ({ big: b, days: daysSinceMs(b.lastActiveAt) }))
      .filter(x=> x.days >= STALL_DAYS)
      .sort((a,b)=> b.days - a.days);
  }

  // 週は月曜はじまり。0が今週、1が先週、-1が来週のあたま。
  function weekStart(offsetWeeks){
    const d = new Date(); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) - offsetWeeks * 7);
    return d;
  }
  function countInRange(from, to){
    let n = 0;
    const d = new Date(from);
    while(d < to){ n += (dayLog[dateKeyOf(d)] || 0); d.setDate(d.getDate() + 1); }
    return n;
  }

  function shortTitle(t){
    const one = String(t || '').replace(/\s+/g, ' ').trim();
    return one.length > 22 ? one.slice(0, 21) + '…' : one;
  }

  let dogMoodNow = null;
  function setDogMood(mood){
    if(dogMoodNow === mood) return;   // 同じ顔なら描き直さない（動きが途切れるので）
    dogMoodNow = mood;
    const el = document.getElementById('facts-ico');
    if(el) el.innerHTML = dogSVG(mood);
  }

  function updateFactsCard(){
    const stallEl = document.getElementById('fact-stall');
    if(!stallEl) return;

    const st = stalledBigs();
    setDogMood(st.length ? 'worry' : (state.dayWasAchieved ? 'happy' : 'calm'));
    stallEl.innerHTML = '<span class="fs-ico"></span><span class="fs-txt"></span><span class="fs-more"></span>';
    const icoEl  = stallEl.querySelector('.fs-ico');
    const txtEl  = stallEl.querySelector('.fs-txt');
    const moreEl = stallEl.querySelector('.fs-more');

    if(st.length){
      const top = st[0];
      stallEl.className = 'fact-stall';
      icoEl.textContent = '⚠';
      // 仕事の名前は本人が書いた文字なので、組み立てて入れる（HTMLとして扱わない）
      txtEl.appendChild(document.createTextNode('「' + shortTitle(top.big.title) + '」は '));
      const b = document.createElement('b');
      b.textContent = top.days + '日';
      txtEl.appendChild(b);
      txtEl.appendChild(document.createTextNode(' 進んでいません'));
      moreEl.textContent = st.length > 1 ? 'ほか' + (st.length - 1) + '件' : '';
      stallEl.onclick = ()=> scrollToBig(top.big.id);
    } else {
      stallEl.className = 'fact-stall calm';
      icoEl.textContent = '✓';
      txtEl.textContent = state.bigs.some(b=> b.title && b.title.trim())
        ? '止まっているものは、ありません'
        : '大きな仕事を書くと、止まっているものがここに出ます';
      moreEl.textContent = '';
      stallEl.onclick = null;
    }

    const thisWeek = countInRange(weekStart(0), weekStart(-1));
    const lastWeek = countInRange(weekStart(1), weekStart(0));
    const weekEl = document.getElementById('fact-week');
    weekEl.innerHTML = '';
    weekEl.appendChild(document.createTextNode('今週 ' + thisWeek + '個'));
    const last = document.createElement('span');
    last.className = 'fw-last';
    last.textContent = '　／　先週 ' + lastWeek + '個';
    weekEl.appendChild(last);

    const streak = currentStreak();
    const streakEl = document.getElementById('fact-streak');
    streakEl.innerHTML = '';
    if(streak > 0){
      streakEl.textContent = '🔥 連続 ' + streak + '日';
    } else {
      const off = document.createElement('span');
      off.className = 'fs-off';
      off.textContent = '連続 0日';
      streakEl.appendChild(off);
    }
  }

  // 「進んでいません」を押したら、その仕事まで画面を送って光らせる
  function scrollToBig(id){
    const el = document.querySelector('#blocks [data-block-key="big:' + id + '"]');
    if(!el) return;
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    const card = el.querySelector('.big-card') || el;
    card.classList.add('big-flash');
    setTimeout(()=> card.classList.remove('big-flash'), 1600);
  }

  // ---- 「最後に進んだ日」を、これまでの記録から割り出す（足りないぶんだけ・1回だけ） ----
  // days/{YYYY-MM-DD} には、その日に保存した状態が残っている。日をまたいで
  // 「終わった数」が増えていれば、その日に進んだということ。
  // 読み出しに失敗したときは、何も書かない（次に開いたときにやり直す）。
  function dateKeyToMs(k){
    const p = k.split('-');
    return new Date(+p[0], +p[1]-1, +p[2], 12, 0, 0).getTime();
  }
  function backfillLastActive(uid){
    if(state.bigs.every(b=> typeof b.lastActiveAt === 'number')) return Promise.resolve(false);
    return fbDb.collection('users').doc(uid).collection('days').get().then(snap=>{
      const days = [];
      snap.forEach(doc=>{
        if(!/^\d{4}-\d{2}-\d{2}$/.test(doc.id)) return;
        const d = doc.data();
        if(Array.isArray(d.bigs)) days.push({ key: doc.id, bigs: d.bigs });
      });
      days.sort((a,b)=> a.key < b.key ? -1 : 1);
      const lastMove = {}, prev = {};
      days.forEach(day=>{
        day.bigs.forEach(b=>{
          const k = String(b.id);
          let n = b.done ? 1 : 0;
          (b.mediums||[]).forEach(m=>{
            if(m.done) n++;
            (m.items||[]).forEach(it=>{ if(it.done) n++; });
          });
          if(prev[k] === undefined || n > prev[k]) lastMove[k] = day.key;
          prev[k] = n;
        });
      });
      let touched = false;
      state.bigs.forEach(b=>{
        if(typeof b.lastActiveAt === 'number') return;
        const k = lastMove[String(b.id)];
        b.lastActiveAt = k ? dateKeyToMs(k) : Date.now();
        touched = true;
      });
      return touched;
    });
  }

  const CAL_OPEN_KEY = 'tsumiage_cal_open';

    setCalOpen(!calCardEl.classList.contains('open'), true);

  // ---- Googleアカウントでログインして、保存・共有する仕組み ----
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const userChip = document.getElementById('user-chip');
  const userAvatar = document.getElementById('user-avatar');
  const userName = document.getElementById('user-name');
  const firebaseOffEl = document.getElementById('firebase-off');
  const syncStatusEl = document.getElementById('sync-status');
  const saveNoteEl = document.getElementById('save-note');

  function todayKey(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function docRefForUser(uid){
    return fbDb.collection('users').doc(uid).collection('days').doc(todayKey());
  }

  // ---- メモ欄は日付をまたいで消えないよう、日ごとのデータとは別の場所に保存する ----
  function profileRefForUser(uid){
    return fbDb.collection('users').doc(uid);
  }

  function serializeState(){
    return {
      dayWasAchieved: state.dayWasAchieved,
      blockOrder: state.blockOrder,
      bigs: state.bigs
    };
  }

  function setSyncStatus(text){
    syncStatusEl.textContent = text;
  }

  // ---- 端末どうしのリアルタイム同期／ボードは日付をまたいでも消えない ----
  // 【重大な不具合の修正 2026-08-21】以前は「今日」の記録を日付ごとの
  // 別ファイル(days/YYYY-MM-DD)として扱っていたため、日付が変わると新しい
  // 空のファイルに切りかわり、書いていた内容が画面から見えなくなっていた。
  // （データそのものは消えておらず、前の日のファイルにはそのまま残っていた）
  // これを直し、ボードは1本だけを日付をまたいでずっと使いつづける方式にする。
  // 「🔁毎日くりかえす」を付けた大きな仕事だけ、日付が変わるとチェックが外れて
  // 新しい今日ぶんとして使える状態に戻る。それ以外はいっさい触らない。
  let unsubscribeProfile = null;
  let applyingRemote = false;   // 受信を反映している最中は保存しない（往復ループ防止）
  let pendingRemote = null;     // 入力中に届いた分は、入力が終わってから反映する
  let boardDateKey = null;      // 直前に見た「今日」の日付。変わったら日付またぎの処理をする

  function isEditingNow(){
    const el = document.activeElement;
    if(!el) return false;
    return el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable === true;
  }

  function applyBoardData(board){
    applyingRemote = true;
    try{
      if(typeof board.dayWasAchieved === 'boolean') state.dayWasAchieved = board.dayWasAchieved;
      if(Array.isArray(board.bigs)){
        state.bigs = board.bigs.map(b=>{
          const nb = {
            id: typeof b.id === 'number' ? b.id : 0,
            title: b.title || '',
            done: !!b.done,
            repeatDaily: !!b.repeatDaily,
            wasAchieved: !!b.wasAchieved,
            collapsed: !!b.collapsed,
            mediums: Array.isArray(b.mediums) ? b.mediums.map(m=>({
              name: m.name || '',
              done: !!m.done,
              wasAchieved: !!m.wasAchieved,
              items: Array.isArray(m.items) ? m.items.map(it=>({
                text: it.text || '', done: !!it.done, eveningReviewed: !!it.eveningReviewed
              })) : []
            })) : []
          };
          // 最後に進んだ日。undefined を入れると保存が弾かれるので、あるときだけ足す
          if(typeof b.lastActiveAt === 'number') nb.lastActiveAt = b.lastActiveAt;
          return nb;
        });
        const usedIds = new Set();
        state.bigs.forEach(b=>{ while(usedIds.has(b.id)){ b.id++; } usedIds.add(b.id); });
        nextBigId = state.bigs.length ? Math.max(...state.bigs.map(b=>b.id)) + 1 : 1;
      }
      state.blockOrder = Array.isArray(board.blockOrder) ? board.blockOrder : [];
      render();
    } finally {
      applyingRemote = false;
    }
  }

  // 「🔁毎日くりかえす」の大きな仕事だけ、チェックを外して今日ぶんに戻す。
  // ほかの仕事はいっさい触らない（消さない・並びも変えない）。
  function resetRepeatingItemsForNewDay(){
    let touched = false;
    state.bigs.forEach(b=>{
      if(!b.repeatDaily) return;
      if(b.done){ b.done = false; touched = true; }
      (b.mediums||[]).forEach(m=>{
        if(m.done){ m.done = false; touched = true; }
        (m.items||[]).forEach(it=>{
          if(it.done){ it.done = false; it.eveningReviewed = false; touched = true; }
        });
      });
    });
    return touched;
  }

  // 「ボード」をまだ作っていない古いデータ用：日付ごとの記録の中から、
  // いちばん新しく中身が入っているものを1つだけ見つける（初回だけの引っ越し）。
  function findMostRecentDayWithContent(uid){
    // orderBy(documentId()) は複合インデックスを要求されて失敗することがあるので使わない。
    // 日付キー(YYYY-MM-DD)は文字の大小がそのまま新しい順になるので、取ってから選ぶ。
    // ここで失敗しても握りつぶさない（握りつぶすと、空の状態でボードを上書きしてしまう）。
    return fbDb.collection('users').doc(uid).collection('days').get()
      .then(snap=>{
        let best = null;
        snap.forEach(doc=>{
          const d = doc.data();
          if(!Array.isArray(d.bigs) || !d.bigs.length) return;
          if(!best || doc.id > best.key) best = { data: d, key: doc.id };
        });
        return best;
      });
  }

  function saveBoard(){
    if(!FIREBASE_READY || !currentUser) return Promise.resolve();
    return profileRefForUser(currentUser.uid).set({
      board: {
        bigs: state.bigs,
        blockOrder: state.blockOrder,
        dayWasAchieved: state.dayWasAchieved,
        dateKey: boardDateKey || todayKey()
      }
    }, {merge:true});
  }

  function subscribeToBoard(uid){
    if(unsubscribeProfile){ unsubscribeProfile(); unsubscribeProfile = null; }
    unsubscribeProfile = profileRefForUser(uid).onSnapshot(snap=>{
      if(snap.metadata && snap.metadata.hasPendingWrites) return;   // 自分がいま書いた分の折り返し
      if(!snap.exists) return;
      const pd = snap.data();

      if(typeof pd.totalBlocks === 'number') totalBlocks = pd.totalBlocks;
      if(pd.dayLog && typeof pd.dayLog === 'object') dayLog = pd.dayLog;
      updateFactsCard();   // 受け取った記録で、帯も書き直す

      const board = pd.board;
      if(!board || !Array.isArray(board.bigs)) return;   // まだボードが無い（移行前）
      if(isEditingNow()){ pendingRemote = board; return; }   // 入力中は割りこまない
      applyBoardData(board);
      setSyncStatus('同期ずみ ✓');
    }, ()=>{
      setSyncStatus('同期できていません');
    });
  }

  // 入力が終わったタイミングで、待たせていた受信ぶんを反映する
  document.addEventListener('focusout', ()=>{
    setTimeout(()=>{
      if(pendingRemote && !isEditingNow()){
        const d = pendingRemote; pendingRemote = null;
        applyBoardData(d);
        setSyncStatus('同期ずみ ✓');
      }
    }, 200);
  });

  // ---- 日付が変わったら、見えているものを今日ぶんに入れかえる ----
  // 【2026-08-28の修正】以前は30秒ごとのタイマーだけで見張っていて、しかも
  // 「🔁くりかえし」のチェックを外すことしかしていなかった。そのため Mac を
  // 開きっぱなし・スリープさせたまま日付をまたぐと、1年の進み・連続日数・
  // 今日の点数・ヒントが昨日のまま止まって見えていた（スリープ中はタイマーも
  // 止まるので、ログインしていない間に日付が変わると気づけなかった）。
  // ※ タスクそのものは今までどおり消さない（2026-08-21の事故の再発防止）。
  let lastSeenDateKey = todayKey();

  function checkDayRollover(){
    const tk = todayKey();
    updateDatePill();
    if(lastSeenDateKey === tk) return;
    lastSeenDateKey = tk;

    // 見えているものを今日のものへ書き直す
    renderYearProgress();
    updateFactsCard();       // 止まっている日数・今週／先週・連続日数

    // 昨日読んだ予定が残らないように、カレンダーも読み直す
    if(calLoadedDateKey && calLoadedDateKey !== tk
       && calCardEl && calCardEl.classList.contains('open')){
      loadCalendarNow(false);
    }

    if(!FIREBASE_READY || !currentUser) return;
    if(!boardDateKey || boardDateKey === tk) return;
    boardDateKey = tk;
    resetRepeatingItemsForNewDay();   // 🔁を付けたものだけチェックを外す
    render();
    saveBoard().catch(()=>{});
  }

  setInterval(checkDayRollover, 30000);
  // スリープから戻ったとき・アプリに切りかえたときは、30秒待たずにすぐ見直す
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkDayRollover(); });
  window.addEventListener('focus', checkDayRollover);

  function scheduleSave(){
    if(!FIREBASE_READY || !currentUser) return;
    if(applyingRemote) return;   // 受信を反映しただけのときは書き戻さない
    setSyncStatus('保存中…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      // 本体はこちら。日付をまたいでも消えない1本のボード。
      saveBoard()
        .then(()=> setSyncStatus('保存ずみ ✓'))
        .catch(()=> setSyncStatus('保存に失敗しました'));
      // 「いつ・何をやったか」は、これまでどおり日付ごとにも残しておく
      // （ふりかえり画面の内訳・グラフ用。ボード本体はもう日付に左右されない）
      docRefForUser(currentUser.uid).set(serializeState(), {merge:true}).catch(()=>{});
    }, 800);
  }

  let memoSaveTimer = null;
  function scheduleMemoSave(){
    if(!FIREBASE_READY || !currentUser) return;
    setSyncStatus('保存中…');
    clearTimeout(memoSaveTimer);
    memoSaveTimer = setTimeout(()=>{
      profileRefForUser(currentUser.uid).set({memo: state.memo}, {merge:true})
        .then(()=> setSyncStatus('保存ずみ ✓'))
        .catch(()=> setSyncStatus('保存に失敗しました'));
    }, 800);
  }

  if(!FIREBASE_READY){
    firebaseOffEl.style.display = 'block';
    saveNoteEl.innerHTML = 'これは試作品です。画面を閉じたり更新すると、入力した内容は消えます。<br>Firebaseの設定を貼りつけると、Googleアカウントでログインして保存・共有できるようになります。';
  } else {
    loginBtn.style.display = 'inline-block';
    saveNoteEl.innerHTML = 'ログインすると、この端末とほかの端末(Mac・スマホなど)で内容が共有されます。';

    const provider = new firebase.auth.GoogleAuthProvider();
    loginBtn.addEventListener('click', ()=>{
      fbAuth.signInWithPopup(provider).catch(()=>{
        showToast('ログインできませんでした。もう一度お試しください。');
      });
    });
    logoutBtn.addEventListener('click', ()=>{
      fbAuth.signOut();
    });

    fbAuth.onAuthStateChanged(user=>{
      currentUser = user;
      if(user){
        loginBtn.style.display = 'none';
        userChip.style.display = 'flex';
        userAvatar.src = user.photoURL || '';
        userName.textContent = user.displayName || user.email || 'ログイン中';
        setSyncStatus('読み込み中…');

        // プロフィールを読んで、ボード（積み上げの中身）を用意する。
        // すでに1本のボードがあればそれを使う。無ければ、これまで日付ごとに
        // 分かれていた記録の中から、いちばん新しい中身を探して引き継ぐ
        // （前の版で、日付が変わると画面から消えていた分の救済）。
        profileRefForUser(user.uid).get().then(ps=>{
          const pd = (ps && ps.exists) ? ps.data() : {};
          if(typeof pd.memo === 'string') state.memo = pd.memo;
          totalBlocks = typeof pd.totalBlocks === 'number' ? pd.totalBlocks : 0;
          dayLog = (pd.dayLog && typeof pd.dayLog === 'object') ? pd.dayLog : {};
          updateFactsCard();

          const tk = todayKey();
          if(pd.board && Array.isArray(pd.board.bigs)){
            applyBoardData(pd.board);
            boardDateKey = pd.board.dateKey || tk;
            if(boardDateKey !== tk){
              boardDateKey = tk;
              if(resetRepeatingItemsForNewDay()) render();
              saveBoard();
            }
            // 古いデータには「最後に進んだ日」が入っていないので、記録から割り出す
            return backfillLastActive(user.uid)
              .then(touched=>{ if(touched){ updateFactsCard(); return saveBoard(); } })
              .catch(()=>{});   // 読めなければ何も書かない。次に開いたときにやり直す
          }
          // ボードがまだ無い＝旧バージョンからの引っ越し。過去の記録から復元する。
          return findMostRecentDayWithContent(user.uid).then(found=>{
            boardDateKey = tk;
            if(found){
              applyBoardData(found.data);
              if(found.key !== tk) resetRepeatingItemsForNewDay();
              render();
              showToast('前の記録を見つけたので、積み上げに戻しました。');
            }
            return backfillLastActive(user.uid)
              .catch(()=>false)
              .then(()=>{ updateFactsCard(); return saveBoard(); });
          }).catch(()=>{
            // 読み出しに失敗したときは、何も保存しない。
            // ここで保存すると、中身が入る前の状態でボードを上書きしてしまう。
            setSyncStatus('前の記録を読めませんでした。開き直してください');
          });
        }).catch(()=>{
          setSyncStatus('読み込みに失敗しました');
        }).then(()=>{
          subscribeToBoard(user.uid);
          if(calCardEl && calCardEl.classList.contains('open')) loadCalendarNow(false);
        });
      } else {
        if(unsubscribeProfile){ unsubscribeProfile(); unsubscribeProfile = null; }
        boardDateKey = null;
        userChip.style.display = 'none';
        loginBtn.style.display = 'inline-block';
        setSyncStatus('');
      }
    });
  }

  render();

  // ---- アプリとしてインストールできるようにする ----
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    });
  }
})();
</script>

</body>
